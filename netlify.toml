[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify's Next.js runtime (OpenNext). Declared explicitly because uploads made
# without a linked repository are not auto-detected; Netlify keeps it updated.
[[plugins]]
  package = "@netlify/plugin-nextjs"
